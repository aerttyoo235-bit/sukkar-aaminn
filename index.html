<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>سكّر آمن</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Concept: a sticker-pop game world. Thick ink outlines, hard offset shadows, one bright color per scam type, and "قطرة", an original guardian-drop mascot who reacts to every answer. The CGM trace stays the scoreboard: right answers keep the line inside the 3.9-10.0 mmol/L target band. */
:root{
  --bg:#E4F6F0; --surface:#FFFFFF; --fg:#10283A; --muted:#47606F;
  --ink:#10283A; --shadow:#10283A; --soft:#BFD8D1;
  --sun:#FFC83D; --coral:#FF6A55; --sky:#62C7F5; --mint:#2FD2A4; --on:#10283A;
  --good:#0B8760; --good-bg:#C6F2E1; --bad:#C2301D; --bad-bg:#FFD8D0;
  --trace:#0B8760; --band:rgba(47,210,164,.22);
  --dark-panel:#0F2233; --dark-panel-fg:#E8F4FB;
  --f-display:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1E2D; --surface:#12304A; --fg:#EAF6FF; --muted:#9DB9CB;
    --ink:#BFE3F5; --shadow:#020A11; --soft:#24516E;
    --good:#52E3B4; --good-bg:#0F4A3C; --bad:#FF8A78; --bad-bg:#5A2420;
    --trace:#52E3B4; --band:rgba(47,210,164,.16);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1E2D; --surface:#12304A; --fg:#EAF6FF; --muted:#9DB9CB;
  --ink:#BFE3F5; --shadow:#020A11; --soft:#24516E;
  --good:#52E3B4; --good-bg:#0F4A3C; --bad:#FF8A78; --bad-bg:#5A2420;
  --trace:#52E3B4; --band:rgba(47,210,164,.16);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--f-body); font-size:16px; line-height:1.75;
  padding-block:16px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.deco{position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none}
.wrap{max-width:520px; margin-inline:auto; display:flex; flex-direction:column; gap:16px; position:relative}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--f-display); font-weight:800; font-size:26px; line-height:1.2}
.brand svg{width:34px; height:34px; flex:none}
.badge{font-size:12px; font-weight:600; color:var(--on); background:var(--sun); border:2.5px solid var(--ink); border-radius:999px; padding:0 12px; transform:rotate(-2deg)}

/* CGM scoreboard */
.cgm{background:var(--surface); border:3px solid var(--ink); border-radius:18px; box-shadow:-4px 4px 0 var(--shadow); padding:10px 14px 8px; min-width:0}
.cgm-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
.cgm-who{display:flex; align-items:center; gap:8px}
.cgm-who .mascot{width:38px; height:38px}
.cgm-label{font-size:13px; color:var(--muted); font-weight:500}
.cgm-read{display:flex; align-items:baseline; gap:6px}
.val{font-family:var(--f-mono); font-weight:500; font-size:28px; line-height:1.2; font-variant-numeric:tabular-nums}
.unit{font-family:var(--f-mono); font-size:12px; color:var(--muted)}
.pill{font-size:12px; font-weight:600; padding:0 10px; border-radius:999px; border:2px solid currentColor}
.pill.in{color:var(--good); background:var(--good-bg)}
.pill.out{color:var(--bad); background:var(--bad-bg)}
.chart{direction:ltr; margin-top:4px}
.chart svg{display:block; width:100%; height:auto}
.chart .band{fill:var(--band)}
.chart .tick{fill:var(--muted); font-family:var(--f-mono); font-size:9px}
.chart .grid{stroke:var(--soft); stroke-width:1; stroke-dasharray:2 3}
.seg-new{stroke-dasharray:1; stroke-dashoffset:1; animation:draw .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* Panels */
.panel{background:var(--surface); border:3px solid var(--ink); border-radius:20px; box-shadow:-5px 5px 0 var(--shadow); overflow:hidden; display:flex; flex-direction:column; min-width:0}
.panel-body{padding:16px; display:flex; flex-direction:column; gap:14px; min-width:0}
.strip{background:var(--c, var(--sun)); color:var(--on); border-bottom:3px solid var(--ink); padding:8px 14px; display:flex; align-items:center; gap:10px}
.ico{width:38px; height:38px; flex:none; border-radius:50%; background:#fff; color:#10283A; border:2.5px solid #10283A; display:grid; place-items:center}
.ico svg{width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
.sname{font-family:var(--f-display); font-weight:800; font-size:20px; line-height:1.3; flex:1}
.step{font-family:var(--f-mono); font-size:13px; font-weight:500; background:#fff; color:#10283A; border:2px solid #10283A; border-radius:999px; padding:0 10px}
.dots{display:flex; gap:5px; padding:10px 14px 0}
.dot{flex:1; height:9px; border-radius:6px; background:var(--soft); border:2px solid var(--ink)}
.dot.ok{background:var(--mint)} .dot.no{background:var(--coral)} .dot.cur{background:var(--sun)}
h1,h2,h3{font-family:var(--f-display); margin:0; text-wrap:balance; line-height:1.35}
h1{font-size:38px; font-weight:800}
h2{font-size:24px; font-weight:800}
h3{font-size:18px; font-weight:800}
p{margin:0}
.lead{font-size:17px}
.muted{color:var(--muted); font-size:14px}
:focus-visible{outline:3px solid var(--coral); outline-offset:3px}
h1:focus,h2:focus{outline:none}

/* Hero */
.hero{background:var(--sun); color:var(--on)}
.hero-top{display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
.hero .mascot{width:132px; height:auto; flex:none}
.bubble{background:#fff; color:#10283A; border:3px solid #10283A; border-radius:18px 18px 4px 18px; padding:8px 14px; font-weight:600; font-size:15px; line-height:1.6; margin-bottom:34px; position:relative}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{background:#fff; color:#10283A; border:2.5px solid #10283A; border-radius:999px; padding:0 12px; font-weight:600; font-size:14px}

.btn{
  font-family:var(--f-display); font-size:19px; font-weight:800; cursor:pointer;
  background:var(--coral); color:var(--on); border:3px solid var(--ink); border-radius:16px;
  box-shadow:-4px 4px 0 var(--shadow);
  padding:8px 18px; width:100%; min-height:52px;
}
.btn:active{transform:translate(-3px,3px); box-shadow:-1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--surface); color:var(--fg)}
.btn.small{width:auto; min-height:42px; font-size:15px; padding:4px 14px}
.field{font-family:var(--f-body); font-size:16px; width:100%; padding:11px 12px; border:2.5px solid var(--ink); border-radius:14px; background:var(--surface); color:var(--fg)}

/* Scenario mocks */
.mock{border-radius:14px; overflow:hidden; position:relative; min-width:0; border:2.5px solid var(--ink)}
.mock-tag{position:absolute; top:8px; left:8px; z-index:2; font-size:11px; font-weight:700; background:var(--sun); color:#10283A; border:2px solid #10283A; border-radius:999px; padding:0 9px; line-height:19px; transform:rotate(-3deg)}
.wa{background:var(--bg); padding:36px 12px 14px; display:flex; flex-direction:column; gap:8px}
.wa-from{font-size:12px; color:var(--muted); font-family:var(--f-mono); direction:ltr; text-align:right}
.wa-bubble{background:var(--surface); border:2px solid var(--ink); border-radius:4px 16px 16px 16px; padding:10px 12px; font-size:15px; line-height:1.7}
.wa-code{font-family:var(--f-mono); font-weight:500; letter-spacing:.06em}
.wa-link{display:block; margin-top:6px; font-family:var(--f-mono); font-size:13px; color:var(--good); direction:ltr; text-align:right; overflow-wrap:anywhere; text-decoration:underline}
.web-bar{display:flex; align-items:center; gap:8px; background:var(--bg); border-bottom:2px solid var(--ink); padding:36px 10px 8px}
.web-status{font-size:11px; font-weight:700; color:var(--bad); background:var(--bad-bg); border:1.5px solid var(--bad); border-radius:6px; padding:0 6px; white-space:nowrap}
.web-url{font-family:var(--f-mono); font-size:12px; direction:ltr; overflow-wrap:anywhere; flex:1; min-width:0; text-align:left}
.web-body{background:var(--surface); padding:14px; display:flex; flex-direction:column; gap:8px}
.web-body .big{font-family:var(--f-display); font-weight:800; font-size:21px}
.web-body .strike{color:var(--bad); font-weight:700; font-size:14px}
.fake-field{border:2px dashed var(--soft); border-radius:8px; padding:6px 10px; font-size:13px; color:var(--muted)}
.cmt{font-size:13px; color:var(--muted); border-top:2px solid var(--soft); padding-top:6px}
.perm{background:var(--surface); padding:36px 14px 12px; display:flex; flex-direction:column; gap:8px}
.perm-app{font-weight:600}
.perm-row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:14px; border-top:2px solid var(--soft); padding-top:6px}
.perm-row span:last-child{font-size:12px; color:var(--muted)}
.vid{background:var(--dark-panel); color:var(--dark-panel-fg); padding:36px 14px 14px; display:flex; flex-direction:column; gap:10px; align-items:flex-start}
.vid-play{width:48px; height:48px; border-radius:50%; border:2px solid var(--dark-panel-fg); background:rgba(10,20,23,.55); padding:0; cursor:pointer; display:grid; place-items:center}
.vid-play::after{content:""; border-style:solid; border-width:8px 0 8px 13px; border-color:transparent transparent transparent var(--dark-panel-fg); margin-left:3px}
.vid-name{font-size:13px; opacity:.85}
.vid-meta{font-size:12px; opacity:.7}
.vid-bar{height:4px; width:100%; background:rgba(255,255,255,.2); border-radius:2px; overflow:hidden}
.vid-bar i{display:block; height:100%; width:0; background:var(--dark-panel-fg)}
.vid-stage{width:100%; display:grid; place-items:center}
.vid-stage > *{grid-area:1/1}
.vid-stage svg{width:150px; max-width:60%; height:auto; display:block}
.doc-mouth{transform-box:fill-box; transform-origin:center}
.talking .doc-mouth{animation:talk .32s steps(2,end) infinite alternate}
.talking svg{animation:glitch 1.4s steps(1,end) infinite}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.5)}}
@keyframes glitch{0%,90%{transform:translateX(0)}93%{transform:translateX(4px)}96%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.vid-sub{min-height:3.4em; width:100%; text-align:center; font-size:16px; font-weight:600; line-height:1.7}
.share{background:var(--surface); padding:36px 14px 14px; display:flex; flex-direction:column; gap:10px}
.share-who{display:flex; align-items:center; gap:10px}
.avatar{width:38px; height:38px; border-radius:50%; background:var(--soft); border:2px solid var(--ink); display:grid; place-items:center; font-weight:700; color:var(--muted); flex:none}
.share-btns{display:flex; gap:8px}
.fake-btn{flex:1; text-align:center; border-radius:10px; padding:6px; font-size:14px; font-weight:600; border:2px solid var(--soft); color:var(--muted)}

/* Choices */
.q{font-family:var(--f-display); font-weight:800; font-size:21px; line-height:1.5}
.choices{display:flex; flex-direction:column; gap:12px; padding:0; margin:0; list-style:none}
.choice{
  font-family:var(--f-body); font-size:15.5px; line-height:1.65; text-align:right; cursor:pointer;
  width:100%; background:var(--surface); color:var(--fg); border:2.5px solid var(--ink); border-radius:14px;
  box-shadow:-3px 3px 0 var(--shadow);
  padding:12px 14px; display:flex; gap:10px; align-items:flex-start;
}
.choice .mark{flex:none; width:24px; height:24px; border-radius:50%; border:2.5px solid var(--ink); display:grid; place-items:center; font-size:14px; font-weight:800; line-height:1; margin-top:1px}
.choice:not(:disabled):active{transform:translate(-2px,2px); box-shadow:-1px 1px 0 var(--shadow)}
.choice:disabled{cursor:default}
.choice.right{background:var(--good-bg); box-shadow:none}
.choice.right .mark{background:var(--mint); color:#10283A}
.choice.wrong{background:var(--bad-bg); box-shadow:none}
.choice.wrong .mark{background:var(--coral); color:#10283A}
.choice.dim{opacity:.55; box-shadow:none}

.fb{border:3px solid var(--ink); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:10px}
.fb.ok{background:var(--good-bg)}
.fb.no{background:var(--bad-bg)}
.fb-head{display:flex; align-items:center; gap:10px}
.fb-head .mascot{width:64px; height:auto; flex:none}
.flags{display:flex; flex-wrap:wrap; gap:6px; padding:0; margin:0; list-style:none}
.flags li{font-size:13px; border:2px solid var(--ink); background:var(--surface); border-radius:999px; padding:0 10px; line-height:24px}
.flags-title{font-size:12px; font-weight:700; color:var(--muted)}

/* Result */
.res-top{display:flex; align-items:center; gap:12px}
.medal{width:96px; height:auto; flex:none}
.score{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.score .num{font-family:var(--f-mono); font-weight:500; font-size:52px; line-height:1.1; font-variant-numeric:tabular-nums}
.flagbox{display:flex; align-items:center; justify-content:space-between; gap:10px; border:2.5px dashed var(--ink); border-radius:14px; padding:10px 12px; flex-wrap:wrap}
.flagbox code{font-family:var(--f-mono); font-size:15px; direction:ltr; overflow-wrap:anywhere}
.review{display:grid; grid-template-columns:1fr 1fr; gap:8px; list-style:none; padding:0; margin:0}
.rv{display:flex; justify-content:space-between; gap:8px; border:2px solid var(--ink); border-radius:12px; padding:3px 10px; font-size:13.5px; min-width:0}
.rv.ok{background:var(--good-bg)} .rv.no{background:var(--bad-bg)}
.rv .mk{font-weight:800}
.rules{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:8px}
.rules li{border-top:2px solid var(--soft); padding-top:8px; font-size:15px}
details summary{cursor:pointer; font-weight:800; font-family:var(--f-display); font-size:18px}
details[open] summary{margin-bottom:8px}

/* Certificate: always paper-white so a screenshot looks the same in both themes */
.cert{--muted:#47606F; --soft:#BFD8D1; --band:rgba(47,210,164,.22); --trace:#0B8760; --bad:#C2301D; --surface:#FFFFFF; --ink:#10283A;
  background:#FFFFFF; color:#10283A; border:4px solid #10283A; border-radius:20px; box-shadow:-5px 5px 0 var(--shadow); padding:10px}
.cert-frame{position:relative; border:3px solid #FFC83D; border-radius:14px; padding:20px 12px 14px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; min-width:0}
.cert-frame::before{content:""; position:absolute; inset:5px; border:2px dashed #62C7F5; border-radius:10px; pointer-events:none}
.cert-ribbon{font-family:var(--f-display); font-weight:800; font-size:22px; background:#FF6A55; color:#10283A; border:3px solid #10283A; border-radius:10px; padding:0 22px; transform:rotate(-2deg)}
.cert-sub{font-size:14px; color:#47606F}
.cert-name{font-family:var(--f-display); font-weight:800; font-size:32px; line-height:1.4; overflow-wrap:anywhere; background:linear-gradient(transparent 60%, #FFC83D 60%); padding:0 12px; max-width:100%}
.cert-text{font-size:15px; max-width:30ch; line-height:1.8}
.cert-row{display:flex; align-items:center; justify-content:center; gap:14px}
.cert-row .mascot{width:92px; height:auto}
.cert-row .medal{width:92px}
.cert .chart{width:100%}
.cert code{font-family:var(--f-mono); font-size:14px; direction:ltr; overflow-wrap:anywhere; background:#E4F6F0; border:2px solid #10283A; border-radius:8px; padding:0 10px}
.cert-date{font-size:12.5px; color:#47606F}

.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
.confetti i{position:absolute; top:-24px; display:block; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(560deg)}}
.foot{font-size:12.5px; color:var(--muted); text-align:center; padding-top:4px}
@media (prefers-reduced-motion: reduce){.talking .doc-mouth,.talking svg{animation:none} .seg-new{animation:none; stroke-dasharray:none}}
@media (prefers-reduced-motion: no-preference){
  .choice,.btn{transition:transform .08s, box-shadow .08s, background-color .15s}
}
</style>

<svg class="deco" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g fill="var(--mint)" opacity=".28">

    <path d="M330 420h14v-14h10v14h14v10h-14v14h-10v-14h-14z"/>
    <path d="M60 640h14v-14h10v14h14v10h-14v14h-10v-14h-14z"/>
  </g>
  <g fill="var(--sky)" opacity=".3">
    <path d="M320 150c0 0-16 20-16 33a16 16 0 0 0 32 0c0-13-16-33-16-33z"/>
    <path d="M70 360c0 0-13 16-13 27a13 13 0 0 0 26 0c0-11-13-27-13-27z"/>

  <g fill="var(--sun)" opacity=".4">

  </g>
</svg>

<main class="wrap" dir="rtl" lang="ar">
  <div class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3C20 3 6 18 6 27a14 14 0 0 0 28 0C34 18 20 3 20 3Z" fill="#FF6A55" stroke="#10283A" stroke-width="3" stroke-linejoin="round"/><path d="M12 27c0-5 3-9 6-12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".85"/></svg>
      <span>سكّر آمن</span>
    </div>
    <span class="badge">تحدي تدريبي</span>
  </div>

  <div class="cgm" id="cgm">
    <div class="cgm-head">
      <span class="cgm-who"><span id="cgmface"></span><span class="cgm-label">قراءتك الحين</span></span>
      <span class="cgm-read"><span class="val" id="val">6.1</span><span class="unit">mmol/L</span><span class="pill in" id="pill">داخل المدى</span></span>
    </div>
    <div class="chart" id="chart"></div>
  </div>

  <section id="screen" aria-live="polite"><div class="panel"><div class="panel-body"><h2>اللعبة ما اشتغلت هنا</h2><p>افتح رابط اللعبة في المتصفح (Safari أو Chrome) بدل فتح الملف.</p></div></div></section>

  <p class="foot">كل المواقف في هالتحدي وهمية للتدريب. الموقع ما يجمع أي بيانات منك.</p>
</main>

<script>
(function(){
  var LO = 3.9, HI = 10.0;
  var OK_VALS  = [6.4, 5.9, 7.2, 6.6, 5.8, 7.0, 6.3, 5.9, 6.5, 6.1];
  var BAD_VALS = [12.4, 11.8, 12.9, 11.6, 12.2, 12.7, 11.9, 12.5, 12.1, 11.7];

  /* ---------- Illustrations ---------- */
  var INK = '#10283A';
  function mascot(mood, shield){
    var mouth, brows = '', extra = '';
    if(mood === 'happy'){
      mouth = '<path d="M45 101 Q60 126 75 101 Z" fill="#7A1F18" stroke="' + INK + '" stroke-width="3" stroke-linejoin="round"/><path d="M52 112 Q60 119 68 112" fill="#FF8F82"/>';
    } else if(mood === 'worry'){
      mouth = '<path d="M49 112 Q60 102 71 112" fill="none" stroke="' + INK + '" stroke-width="3.5" stroke-linecap="round"/>';
      brows = '<path d="M38 70 L54 77 M82 70 L66 77" stroke="' + INK + '" stroke-width="3.5" stroke-linecap="round"/>';
      extra = '<path d="M104 48 C104 48 95 59 95 66 C95 71 99 75 104 75 C109 75 113 71 113 66 C113 59 104 48 104 48Z" fill="#62C7F5" stroke="' + INK + '" stroke-width="2.5"/>';
    } else {

  function shuffled(n){
    var a = [], i, j, t;
    for(i = 0; i < n; i++){ a.push(i); }
    for(i = n - 1; i > 0; i--){ j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function tierOf(c){
    if(c === TOTAL) return 'gold';
    if(c >= TOTAL - 2) return 'silver';
    if(c >= Math.ceil(TOTAL / 2)) return 'bronze';
    return 'part';
  }

  var X0 = 40, X1 = 306, W = 320, H = 100;
  function xAt(k){ return X0 + k * ((X1 - X0) / TOTAL); }
  function yAt(v){ return 10 + (14 - v) / 12 * 76; }

  function chartSvg(r, animate){
    var n = r.length, s = '', k;
    s += '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="رسم قراءاتك، آخر قراءة ' + r[n-1].toFixed(1) + ' ' + statusText(r[n-1]) + '">';
    s += '<rect class="band" x="34" y="' + yAt(HI) + '" width="280" height="' + (yAt(LO) - yAt(HI)) + '"/>';
    s += '<line class="grid" x1="34" x2="314" y1="' + yAt(HI) + '" y2="' + yAt(HI) + '"/>';
    s += '<line class="grid" x1="34" x2="314" y1="' + yAt(LO) + '" y2="' + yAt(LO) + '"/>';
    s += '<text class="tick" x="0" y="' + (yAt(HI) + 3) + '">10.0</text>';
    s += '<text class="tick" x="0" y="' + (yAt(LO) + 3) + '">3.9</text>';
    for(k = 1; k < n; k++){
      var x0 = xAt(k-1), y0 = yAt(r[k-1]), x1 = xAt(k), y1 = yAt(r[k]), mx = (x0 + x1) / 2;
      var col = inRange(r[k]) ? 'var(--trace)' : 'var(--bad)';
      var cls = (animate && k === n - 1) ? ' class="seg-new"' : '';
      s += '<path' + cls + ' pathLength="1" d="M' + x0 + ' ' + y0 + ' C' + mx + ' ' + y0 + ' ' + mx + ' ' + y1 + ' ' + x1 + ' ' + y1 + '" fill="none" stroke="' + col + '" stroke-width="3" stroke-linecap="round"/>';
    }
    for(k = 0; k < n; k++){
      var c = inRange(r[k]) ? 'var(--trace)' : 'var(--bad)';
      var last = (k === n - 1);
      s += '<circle cx="' + xAt(k) + '" cy="' + yAt(r[k]) + '" r="' + (last ? 5.5 : 3.4) + '" fill="' + (last ? c : 'var(--surface)') + '" stroke="' + c + '" stroke-width="2.2"/>';
    }
    s += '</svg>';
    return s;
  }

  function drawChart(animate){
    var r = state.readings, v = r[r.length - 1];
    chartEl.innerHTML = chartSvg(r, animate);
    valEl.textContent = v.toFixed(1);
    pillEl.textContent = statusText(v);
    pillEl.className = 'pill ' + (inRange(v) ? 'in' : 'out');
    faceEl.innerHTML = mascot(inRange(v) ? 'happy' : 'worry', false);
  }

  function focusHeading(){
    var h = screen.querySelector('h1, h2');
    if(h){ h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }

  function confetti(){
    try{
      if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var box = document.createElement('div');
      box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
      var cols = ['var(--sun)', 'var(--coral)', 'var(--sky)', 'var(--mint)'], html = '', i;
      for(i = 0; i < 44; i++){
        var sz = 8 + Math.random() * 8;
        html += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%; width:' + sz.toFixed(1) + 'px; height:' + (sz * (Math.random() > .5 ? 1 : 1.6)).toFixed(1) + 'px; background:' + cols[i % 4] +
          '; border:2px solid #10283A; border-radius:' + (Math.random() > .5 ? '50%' : '3px') +
          '; animation-duration:' + (2.6 + Math.random() * 2).toFixed(2) + 's; animation-delay:' + (Math.random() * 0.8).toFixed(2) + 's"></i>';
      }
      box.innerHTML = html;
      document.body.appendChild(box);
      setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); }, 5600);
    }catch(e){}
  }

  /* ---------- Voice for the video level ---------- */
  var clipId = 0;
  function stopSpeech(){
    clipId++;
    try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  }
  function speakLine(text, done){
    var finished = false, started = Date.now(), tm = null;
    function fin(){
      if(finished) return;
      finished = true; clearTimeout(tm);
      setTimeout(done, Math.max(0, 1600 - (Date.now() - started)));
    }
    tm = setTimeout(fin, 7000);
    try{
      if(window.speechSynthesis && window.SpeechSynthesisUtterance){
        var u = new SpeechSynthesisUtterance(text.replace(/[«»]/g, ''));
        u.lang = 'ar-SA'; u.rate = 0.95;
        var vs = window.speechSynthesis.getVoices() || [];
        for(var k = 0; k < vs.length; k++){ if(vs[k].lang && vs[k].lang.indexOf('ar') === 0){ u.voice = vs[k]; break; } }
        u.onend = fin; u.onerror = fin;
        window.speechSynthesis.speak(u);
        return;
      }
    }catch(e){}
    clearTimeout(tm); tm = setTimeout(fin, 2200);
  }
  function wireVideo(btn){
    var sub = document.getElementById('vsub'), bar = document.getElementById('vbar'), stage = btn.parentNode, running = false;
    function finish(){
      sub.textContent = 'انتهى المقطع. لاحظ حركة الفم والارتجاف وصوت الآلة، من علامات المقاطع المولّدة.';
      stage.classList.remove('talking'); btn.disabled = false; btn.style.visibility = ''; running = false;
    }
    function playStep(step, my){
      if(my !== clipId) return;
      if(step >= VID_LINES.length){ finish(); return; }
      sub.textContent = VID_LINES[step];
      bar.style.width = ((step + 1) / VID_LINES.length * 100) + '%';
      speakLine(VID_LINES[step], function(){ playStep(step + 1, my); });
    }
    btn.addEventListener('click', function(){
      if(running) return;
      running = true;
      var my = ++clipId;
      stage.classList.add('talking'); btn.disabled = true; btn.style.visibility = 'hidden';
      playStep(0, my);
    });
  }

  /* ---------- Screens ---------- */
  function showIntro(){
    stopSpeech();
    state = { i: 0, correct: 0, readings: [6.1], results: [], answered: false, tir: 0, flag: '' };
    drawChart(false);
    screen.innerHTML =
      '<div class="panel hero"><div class="panel-body">' +
      '<div class="hero-top"><div class="bubble">أنا قطرة، حارس قراءتك. ساعدني نكشف الخدع!</div>' + mascot('happy', true) + '</div>' +
      '<h1>اكشف الخدعة، وخلّ قراءتك داخل المدى</h1>' +
      '<p class="lead">' + TOTAL + ' مواقف احتيال تصير مع مرضى السكري. كل إجابة صح تثبّت الخط داخل المدى، وكل غلطة تطلّعه.</p>' +
      '<div class="chips"><span class="chip">' + TOTAL + ' مواقف</span><span class="chip">حوالي 6 دقايق</span><span class="chip">شهادة بالنهاية</span></div>' +
      '<button class="btn" id="start" type="button">ابدأ التحدي</button></div></div>';
    document.getElementById('start').addEventListener('click', showLevel);
    focusHeading();
  }

  function dotsHtml(){
    var s = '<div class="dots" role="img" aria-label="المرحلة ' + (state.i + 1) + ' من ' + TOTAL + '">', k, cls;
    for(k = 0; k < TOTAL; k++){
      cls = 'dot';
      if(k < state.results.length){ cls += state.results[k] ? ' ok' : ' no'; }
      else if(k === state.i){ cls += ' cur'; }
      s += '<span class="' + cls + '"></span>';
    }
    return s + '</div>';
  }

  function showLevel(){
    stopSpeech();
    var L = LEVELS[state.i];
    state.answered = false;
    var order = shuffled(L.choices.length);
    var html = '<div class="panel" style="--c:var(--' + L.c + ')">' +
      '<div class="strip"><span class="ico">' + ICONS[L.icon] + '</span><span class="sname">' + L.name + '</span><span class="step">' + (state.i + 1) + ' / ' + TOTAL + '</span></div>' +
      dotsHtml() +
      '<div class="panel-body">' + L.mock +
      '<h2 class="q">' + L.q + '</h2>' +
      '<ul class="choices">';
    order.forEach(function(idx){
      html += '<li><button class="choice" type="button" data-i="' + idx + '"><span class="mark" aria-hidden="true"></span><span>' + L.choices[idx].t + '</span></button></li>';
    });
    html += '</ul><div id="fb"></div></div></div>';
    screen.innerHTML = html;
    Array.prototype.forEach.call(screen.querySelectorAll('.choice'), function(b){
      b.addEventListener('click', function(){ answer(parseInt(b.getAttribute('data-i'), 10)); });
    });
    var vp = document.getElementById('vplay');
    if(vp){ wireVideo(vp); }
    focusHeading();
  }

  function answer(idx){
    if(state.answered) return;
    state.answered = true;
    var L = LEVELS[state.i];
    var picked = L.choices[idx];
    var prev = state.readings[state.readings.length - 1];
    var next;
    if(picked.ok){ state.correct++; next = prev > HI ? 8.6 : OK_VALS[state.i]; }
    else { next = BAD_VALS[state.i]; }
    state.readings.push(next);
    state.results.push(!!picked.ok);
    drawChart(true);

    Array.prototype.forEach.call(screen.querySelectorAll('.choice'), function(b){
      var bi = parseInt(b.getAttribute('data-i'), 10);
      var m = b.querySelector('.mark');
      b.disabled = true;
      if(L.choices[bi].ok){ b.classList.add('right'); m.textContent = '✓'; }
      else if(bi === idx){ b.classList.add('wrong'); m.textContent = '✕'; }
      else { b.classList.add('dim'); }
    });

    var isLast = state.i === TOTAL - 1;
    var fb = '<div class="fb ' + (picked.ok ? 'ok' : 'no') + '">' +
      '<div class="fb-head">' + mascot(picked.ok ? 'happy' : 'worry', false) +
      '<h3>' + (picked.ok ? 'صح عليك! قراءتك داخل المدى' : 'انتبه، قراءتك طلعت عن المدى') + '</h3></div>' +
      '<p>' + L.why + '</p>' +
      '<div class="flags-title">علامات الخطر في هالموقف</div><ul class="flags">';
    L.flags.forEach(function(f){ fb += '<li>' + f + '</li>'; });
    fb += '</ul><button class="btn" id="next" type="button">' + (isLast ? 'شوف نتيجتك' : 'المرحلة الجاية') + '</button></div>';
    var box = document.getElementById('fb');
    box.innerHTML = fb;
    var nb = document.getElementById('next');
    nb.addEventListener('click', function(){
      if(isLast){ showResult(); } else { state.i++; showLevel(); }
    });
    nb.focus({ preventScroll: true });
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  var CERT_TITLES = { gold: 'شهادة تميّز', silver: 'شهادة تقدير', bronze: 'شهادة إنجاز', part: 'شهادة مشاركة' };

  function showCert(){
    var nameEl = document.getElementById('nm');
    var name = ((nameEl && nameEl.value) || '').trim() || 'المشارك';
    var d;
    try{ d = new Date().toLocaleDateString('ar-SA-u-ca-gregory', { year: 'numeric', month: 'long', day: 'numeric' }); }
    catch(e){ d = new Date().toDateString(); }
    var tier = tierOf(state.correct);
    var box = document.getElementById('certbox');
    box.innerHTML =
      '<div class="cert"><div class="cert-frame">' +
      '<div class="cert-ribbon">' + CERT_TITLES[tier] + '</div>' +
      '<div class="cert-sub">تُمنح هذه الشهادة إلى</div>' +
      '<div class="cert-name" id="cname"></div>' +
      '<div class="cert-text">لإتمامها تحدي «سكّر آمن» للتوعية بالاحتيال الرقمي لمرضى السكري، بنتيجة <b>' + state.tir + '%</b> من الوقت داخل المدى.</div>' +
      '<div class="cert-row">' + mascot('happy', true) + medal(tier) + '</div>' +
      '<div class="chart">' + chartSvg(state.readings, false) + '</div>' +
      '<code>' + state.flag + '</code>' +
      '<div class="cert-date">' + d + ' · فعالية التوعية بالسكري</div></div></div>' +
      '<p class="muted" style="margin-top:8px">خذ لقطة شاشة للشهادة وشاركها.</p>';
    document.getElementById('cname').textContent = name;
    box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function showResult(){
    var c = state.correct;
    var tir = Math.round(c / TOTAL * 100);
    var tier = tierOf(c);
    var rank, line;
    if(tier === 'gold'){ rank = 'درع السكري'; line = 'ما مرت عليك ولا خدعة. شارك التحدي مع أهلك.'; }
    else if(tier === 'silver'){ rank = 'شبه مثالي'; line = 'غلطة أو غلطتين بس. جرّب مرة ثانية وخذ العلامة الكاملة.'; }
    else if(tier === 'bronze'){ rank = 'قريب من المدى'; line = 'تعرف الأساسيات. راجع علامات الخطر وجرّب مرة ثانية.'; }
    else { rank = 'جرّب مرة ثانية'; line = 'هالخدع تضبط حتى الواعين. اقرا القواعد تحت وأعد التحدي.'; }
    var flag = 'FLAG{sukkar_aamin_' + c + 'of' + TOTAL + '}';
    state.tir = tir; state.flag = flag;

    var html = '<div class="panel">' +
      '<div class="strip" style="--c:var(--sun)"><span class="ico">' + ICONS.play.replace(/<path d="M13 12l7 4-7 4z"\/>/, '<path d="M10 17l4 4 8-9"/>') + '</span><span class="sname">النتيجة</span><span class="step">' + c + ' / ' + TOTAL + '</span></div>' +
      '<div class="panel-body">' +
      '<div class="res-top">' + medal(tier) + '<div><h2>' + rank + '</h2>' +
      '<div class="score"><span class="num">' + tir + '%</span><span class="muted">الوقت داخل المدى</span></div></div></div>' +
      '<p>' + line + '</p>' +
      '<h3>مراجعة مراحلك</h3><ul class="review">';
    LEVELS.forEach(function(L, k){
      var ok = state.results[k];
      html += '<li class="rv ' + (ok ? 'ok' : 'no') + '"><span>' + L.name + '</span><span class="mk">' + (ok ? '✓' : '✕') + '</span></li>';
    });
    html += '</ul>' +
      '<div class="flagbox"><code id="flag">' + flag + '</code><button class="btn ghost small" id="copy" type="button">انسخ العلامة</button></div>' +
      '<div id="certbox"><label class="muted" for="nm">اسمك للشهادة (يبقى على جوالك ولا ينرسل لأي مكان)</label>' +
      '<div style="display:flex; flex-direction:column; gap:10px; margin-top:6px"><input class="field" id="nm" type="text" maxlength="30" autocomplete="off" placeholder="اكتب اسمك">' +
      '<button class="btn" id="mkcert" type="button">اصنع شهادتي</button></div></div>' +
      '<details><summary>القواعد الثمان اللي تحميك</summary><ul class="rules">';
    RULES.forEach(function(r){ html += '<li>' + r + '</li>'; });
    html += '</ul></details><button class="btn ghost" id="again" type="button">العب من جديد</button></div></div>';
    screen.innerHTML = html;

    document.getElementById('again').addEventListener('click', showIntro);
    document.getElementById('mkcert').addEventListener('click', showCert);
    var copyBtn = document.getElementById('copy');
    copyBtn.addEventListener('click', function(){
      function selectText(){
        try{
          var rng = document.createRange(); rng.selectNodeContents(document.getElementById('flag'));
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rng);
        }catch(e){}
        copyBtn.textContent = 'حدّد العلامة وانسخها';
      }
      try{
        navigator.clipboard.writeText(flag).then(function(){ copyBtn.textContent = 'تم النسخ'; }).catch(selectText);
      }catch(e){ selectText(); }
    });
    focusHeading();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if(c >= TOTAL - 2){ confetti(); }
  }

  showIntro();
})();
</script>

</body></html>
